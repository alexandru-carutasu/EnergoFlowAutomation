stages:
  - build
  - test
  - deploy

variables:
  REGISTRY: $CI_REGISTRY_IMAGE
  VERSION: $CI_COMMIT_SHORT_SHA
  DOCKER_TLS_CERTDIR: "/certs"

# ── Reusable build template ───────────────────────────────────────────────────

.docker_build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  only:
    - main
    - tags

# ── Build jobs ────────────────────────────────────────────────────────────────
# db-service, api-service, scheduler-service use project root as build context
# because they copy shared code (services/, templates/, etc.)

build:db-service:
  extends: .docker_build
  script:
    - >
      docker build
      -t "$REGISTRY/db-service:$VERSION"
      -t "$REGISTRY/db-service:latest"
      -f microservices/db-service/Dockerfile
      .
    - docker push "$REGISTRY/db-service:$VERSION"
    - docker push "$REGISTRY/db-service:latest"

build:auth-service:
  extends: .docker_build
  script:
    - >
      docker build
      -t "$REGISTRY/auth-service:$VERSION"
      -t "$REGISTRY/auth-service:latest"
      -f microservices/auth-service/Dockerfile
      .
    - docker push "$REGISTRY/auth-service:$VERSION"
    - docker push "$REGISTRY/auth-service:latest"

build:api-service:
  extends: .docker_build
  script:
    - >
      docker build
      -t "$REGISTRY/api-service:$VERSION"
      -t "$REGISTRY/api-service:latest"
      -f microservices/api-service/Dockerfile
      .
    - docker push "$REGISTRY/api-service:$VERSION"
    - docker push "$REGISTRY/api-service:latest"

build:scheduler-service:
  extends: .docker_build
  script:
    - >
      docker build
      -t "$REGISTRY/scheduler-service:$VERSION"
      -t "$REGISTRY/scheduler-service:latest"
      -f microservices/scheduler-service/Dockerfile
      .
    - docker push "$REGISTRY/scheduler-service:$VERSION"
    - docker push "$REGISTRY/scheduler-service:latest"

# ── Test stage ────────────────────────────────────────────────────────────────

test:lint:
  stage: test
  image: python:3.11-slim
  script:
    - pip install --quiet flake8
    - flake8 microservices/ --max-line-length=120 --exclude=__pycache__
  allow_failure: true
  only:
    - main
    - merge_requests

# ── Deploy to Docker Swarm ────────────────────────────────────────────────────
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   SWARM_HOST        — IP or hostname of the Swarm manager
#   SWARM_USER        — SSH user on the manager
#   SWARM_SSH_KEY     — Private SSH key (file type, protected)
#   SWARM_HOST_KEY    — SSH known_hosts line for the manager

deploy:swarm:
  stage: deploy
  image: alpine:3.19
  environment:
    name: production
    url: http://$SWARM_HOST:8000
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SWARM_SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SWARM_HOST_KEY" >> ~/.ssh/known_hosts
  script:
    # Copy stack files to manager
    - ssh "$SWARM_USER@$SWARM_HOST" "mkdir -p /opt/energoflow/kong /opt/energoflow/monitoring"
    - scp docker-stack.yml "$SWARM_USER@$SWARM_HOST:/opt/energoflow/docker-stack.yml"
    - scp kong/kong.yml "$SWARM_USER@$SWARM_HOST:/opt/energoflow/kong/kong.yml"
    - scp monitoring/prometheus.yml "$SWARM_USER@$SWARM_HOST:/opt/energoflow/monitoring/prometheus.yml"
    # Authenticate to registry and deploy stack
    - |
      ssh "$SWARM_USER@$SWARM_HOST" "
        docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' '$CI_REGISTRY' &&
        cd /opt/energoflow &&
        VERSION=$VERSION REGISTRY=$CI_REGISTRY_IMAGE \
        docker stack deploy -c docker-stack.yml energoflow --with-registry-auth --prune
      "
  only:
    - main
  when: manual          # trigger manually from GitLab UI after reviewing the build
  needs:
    - build:db-service
    - build:auth-service
    - build:api-service
    - build:scheduler-service
