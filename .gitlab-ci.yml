stages:
  - build
  - test
  - deploy

variables:
  REGISTRY: $CI_REGISTRY_IMAGE
  VERSION: $CI_COMMIT_SHORT_SHA
  NAMESPACE: energoflow

# ── Reusable Kaniko build template ────────────────────────────────────────────
.kaniko_build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE_PATH"
      --destination "$REGISTRY/$SERVICE_NAME:$VERSION"
      --destination "$REGISTRY/$SERVICE_NAME:latest"
  only:
    - main
    - tags

# ── Build jobs ────────────────────────────────────────────────────────────────
build:db-service:
  extends: .kaniko_build
  variables:
    SERVICE_NAME: "db-service"
    DOCKERFILE_PATH: "microservices/db-service/Dockerfile"

build:auth-service:
  extends: .kaniko_build
  variables:
    SERVICE_NAME: "auth-service"
    DOCKERFILE_PATH: "microservices/auth-service/Dockerfile"

build:api-service:
  extends: .kaniko_build
  variables:
    SERVICE_NAME: "api-service"
    DOCKERFILE_PATH: "microservices/api-service/Dockerfile"

build:scheduler-service:
  extends: .kaniko_build
  variables:
    SERVICE_NAME: "scheduler-service"
    DOCKERFILE_PATH: "microservices/scheduler-service/Dockerfile"

# ── Test stage ────────────────────────────────────────────────────────────────
test:lint:
  stage: test
  image: python:3.11-slim
  script:
    - pip install --quiet flake8
    - flake8 microservices/ --max-line-length=120 --exclude=__pycache__
  allow_failure: true
  only:
    - main
    - merge_requests

# ── Deploy stage ──────────────────────────────────────────────────────────────
deploy_to_azure:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config
    - kubectl get nodes
  script:
    - kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

    - kubectl create secret docker-registry gitlab-auth \
        --docker-server=$CI_REGISTRY \
        --docker-username="gitlab+deploy-token-38" \
        --docker-password=$GITLAB_DEPLOY_PASSWORD \
        -n $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

    - kubectl apply -f k8s/base/ -n $NAMESPACE

    - kubectl set image deployment/api-service api-service=$REGISTRY/api-service:$VERSION -n $NAMESPACE
    - kubectl set image deployment/auth-service auth-service=$REGISTRY/auth-service:$VERSION -n $NAMESPACE
    - kubectl set image deployment/db-service db-service=$REGISTRY/db-service:$VERSION -n $NAMESPACE
    - kubectl set image deployment/scheduler-service scheduler-service=$REGISTRY/scheduler-service:$VERSION -n $NAMESPACE

    - kubectl rollout status deployment/api-service -n $NAMESPACE --timeout=120s
    - kubectl rollout status deployment/auth-service -n $NAMESPACE --timeout=120s
    - kubectl rollout status deployment/db-service -n $NAMESPACE --timeout=120s
    - kubectl rollout status deployment/scheduler-service -n $NAMESPACE --timeout=120s
  only:
    - main
  when: manual