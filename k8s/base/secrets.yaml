apiVersion: v1
kind: Secret
metadata:
  name: energoflow-secrets
  namespace: energoflow
type: Opaque
stringData:
  DB_PASSWORD: "changeme"
  JWT_SECRET: "change-me-in-production"
  SECRET_KEY: "energoflow-dev-secret-key"
  GRAFANA_PASSWORD: "admin"
---
apiVersion: v1
kind: Secret
metadata:
  name: email-secrets
  namespace: energoflow
type: Opaque
stringData:
  IMAP_SERVER: "imap.example.com"
  IMAP_ADDRESS: "your_email@example.com"
  IMAP_PASSWORD: "your_password"
  FORECAST_ADDRESS: "forecast@example.com"
  IBD_ADDRESS: "ibd@example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: dropbox-secrets
  namespace: energoflow
type: Opaque
stringData:
  DROPBOX_APP_KEY: "key"
  DROPBOX_APP_SECRET: "secret"
