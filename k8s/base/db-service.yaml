apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-service
  namespace: energoflow
  labels:
    app: db-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-service
  template:
    metadata:
      labels:
        app: db-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5003"
    spec:
      containers:
        - name: db-service
          image: energoflow/db-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: energoflow-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: energoflow-secrets
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: energoflow
spec:
  selector:
    app: db-service
  ports:
    - port: 5003
      targetPort: 5003
