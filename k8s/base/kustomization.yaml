apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: energoflow

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - mysql.yaml
  - db-service.yaml
  - auth-service.yaml
  - api-service.yaml
  - scheduler-service.yaml
  - kong.yaml
  - adminer.yaml
  - prometheus.yaml
  - grafana.yaml

commonLabels:
  app.kubernetes.io/part-of: energoflow
  app.kubernetes.io/managed-by: kustomize
