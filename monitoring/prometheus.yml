global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-service
    static_configs:
      - targets: ["api-service:5000"]
    metrics_path: /metrics

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:5001"]
    metrics_path: /metrics

  - job_name: db-service
    static_configs:
      - targets: ["db-service:5003"]
    metrics_path: /metrics

  - job_name: scheduler-service
    static_configs:
      - targets: ["scheduler-service:5002"]
    metrics_path: /metrics

  # Infrastructure metrics (if node-exporter is added later)
  # - job_name: node
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
